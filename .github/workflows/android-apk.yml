name: FACTS AI Android APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: write

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build Android APK
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Accept Android SDK Licenses & Install SDK 35
        run: |
          export ANDROID_HOME="${ANDROID_HOME:-/usr/local/lib/android/sdk}"
          export PATH="$ANDROID_HOME/cmdline-tools/latest/bin:$ANDROID_HOME/platform-tools:$PATH"
          if command -v sdkmanager >/dev/null 2>&1; then
            yes | sdkmanager --licenses || true
            sdkmanager "platforms;android-35" "build-tools;35.0.0" || true
          fi

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Make Gradle Wrapper Executable
        run: chmod +x android/gradlew

      - name: Build Debug APK
        working-directory: android
        env:
          GRADLE_OPTS: "-Xmx4096m -XX:MaxMetaspaceSize=1024m -XX:+UseG1GC -Dfile.encoding=UTF-8"
        run: |
          ./gradlew assembleDebug --stacktrace

      - name: Verify APK
        run: |
          APK=$(find android/app/build/outputs/apk/debug -name "*.apk" | head -n 1)
          if [ -z "$APK" ] || [ ! -s "$APK" ]; then
            echo "::error::Debug APK was not found or is empty!"
            exit 1
          fi
          echo "Verified APK build: $APK ($(du -h "$APK" | cut -f1))"
          ls -lh "$APK"

      - name: Publish APK to GitHub Release
        if: github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          APK=$(find android/app/build/outputs/apk/debug -name "*.apk" | head -n 1)
          TAG_NAME="v1.0.${{ github.run_number }}"
          echo "Publishing release $TAG_NAME with $APK..."
          gh release create "$TAG_NAME" "$APK" \
            --title "FACTS AI Android App $TAG_NAME" \
            --notes "### 📱 FACTS AI Android Application
          Automated YouTube video generator & channel manager.
          - APK binary: $(basename "$APK") ($(du -h "$APK" | cut -f1))
          - Commit: ${{ github.sha }}
          - Download the .apk file directly below to install on your Android device." \
            --clobber || true

          # Also create/update latest rolling release
          gh release create "latest" "$APK" \
            --title "FACTS AI Android App (Latest APK)" \
            --notes "Latest build of FACTS AI Android App. Direct APK download below." \
            --clobber || true

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        continue-on-error: true
        with:
          name: FACTS-AI-Android-debug-APK
          path: android/app/build/outputs/apk/debug/*.apk
          if-no-files-found: warn
          retention-days: 1
